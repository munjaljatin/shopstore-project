<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E4749"/>
      <stop offset="100%" stop-color="#0A3536"/>
    </linearGradient>
  </defs>

  <!-- SHOP in solid ink, STORE picked out in the coral/gold accent, sharing one baseline -->
  <text x="320" y="120" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="64" letter-spacing="1">
    <tspan fill="url(#wordGrad)">SHOP</tspan><tspan fill="#FF6B57">STORE</tspan>
  </text>

  <!-- underline swapped for a single ribbon-tick, echoing the bag mark's knot without reusing the icon -->
  <path d="M232,142 C300,158 340,158 408,142"
        fill="none" stroke="#E8B84B" stroke-width="6" stroke-linecap="round"/>

  <text x="320" y="176" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="500"
        font-size="16" letter-spacing="7" fill="#0A3536" opacity="0.7">ONLINE STORE</text>
</svg>
